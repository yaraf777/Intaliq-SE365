    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#050505" />
    <script>
      // Apply the theme and language before first paint so the page doesn't flash.
      // The theme follows the device's light/dark setting unless the visitor picked one.
      let theme = null;
      try {
        theme = localStorage.getItem("intaliq-theme");
      } catch {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = theme;
      if (theme === "light") {
        document.querySelector('meta[name="theme-color"]').content = "#f7f8f3";
      }
      try {
        if (localStorage.getItem("intaliq-lang") === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="phone" aria-label="Intaliq mobile prototype">
        <div class="status-bar">
          <span id="status-time">--:--</span>
          <span class="status-icons">...</span>
        </div>
        <div id="app" class="screen"></div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
